apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dmnk-ws/cloud/
    targetRevision: dev
    path: lab7-argocd-taskflow/applications
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
